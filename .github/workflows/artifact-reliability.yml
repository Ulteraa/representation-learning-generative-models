name: artifact-reliability

on:
  pull_request:
    paths:
      - "experiments/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/artifact-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run artifact reliability audit
        run: python experiments/artifact_reliability_benchmark.py --output-dir "$RUNNER_TEMP/artifact-reliability"
